services:
  db:
    image: postgres:15-alpine
    container_name: product_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: product_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d product_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: product_fastapi
    restart: always
    ports:
      - "1314:1314"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/product_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: