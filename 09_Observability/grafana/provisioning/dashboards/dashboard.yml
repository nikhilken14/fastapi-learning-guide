apiVersion: 1

# Tells Grafana to auto-load any dashboard JSON files found in
# /var/lib/grafana/dashboards (mounted from ./grafana/dashboards) on
# startup, instead of requiring someone to import a JSON file by hand.
providers:
  - name: default
    folder: "Orders Service"
    type: file
    options:
      path: /var/lib/grafana/dashboards
